[package]
name = "genra-av-machine"
description = "Machine repair for Genra AV: journal and undo, the fixed list of repair actions, Excel, health and startup items"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
genra-av-core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"
cfb = "0.16"
zip = { version = "2", default-features = false, features = ["deflate"] }
plist = { version = "1", default-features = false }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
