# Tests on every pull request and on main, on the systems Genra ships for. The engine, the
# machine layer and the CLI run their tests natively here: Windows matters most (attributes,
# registry, Authenticode paths are Windows-only code that a Mac cannot run).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test engine, machine layer and CLI
        run: cargo test --locked -p genra-av-core -p genra-av-machine -p genra-av
      - name: Real Defender check, with its output (asked, or why it was skipped)
        if: runner.os == 'Windows'
        run: cargo test --locked -p genra-av-machine real_defender -- --nocapture
      - name: Clippy
        run: cargo clippy --locked -p genra-av-core -p genra-av-machine -p genra-av --all-targets -- -D warnings
      - name: Pack scripts (standard library tests)
        shell: bash
        run: $(command -v python3 || command -v python) -m unittest discover -s scripts -p "test_*.py"
