# Detection report (ADR 0004, "measurement gates every layer"): how much recent malware Genra catches,
# per file type, with and without the hash lists, and how many clean files it wrongly flags.
#
# - malware (ubuntu; windows with the defender input): downloads the newest MalwareBazaar samples per file type (AES zips, password
#   "infected"), unpacks them into a scratch folder on this runner, scans them with the CLI and the
#   published signed pack (with yara_preview: plus YARA rules built on the run), and deletes them. Nothing is executed; samples are never uploaded.
#   With defender, the scan also asks Windows Defender about what Genra calls suspicious
#   (`scan --defender`, sample submission switched off first); the report keeps Genra's own
#   columns apart and adds one for what Defender raised.
# - clean (windows): scans Windows' own programs and libraries (System32, signed by Microsoft) and
#   Office files without macros, as the false-positive corpus.
# - report: one Markdown table in the run summary, numbers kept as an artifact for comparison.
#
# Runs weekly and by hand; a release should link the latest report.
name: detection-report

on:
  workflow_dispatch:
    inputs:
      per_type:
        description: Samples per file type (MalwareBazaar has a daily download quota)
        default: "20"
      yara_preview:
        description: Build the YARA rules on this run and add them to an unsigned copy of the pack (branch runs, before the rules are published)
        type: boolean
        default: false
      defender:
        description: Run the malware scan on Windows and ask Windows Defender about suspicious files too (ADR 0004 layer 4)
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: detection-report
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  TYPES: "exe dll doc xls docm xlsm docx xlsx js vbs hta ps1 bat lnk zip rar 7z iso msi"

jobs:
  malware:
    runs-on: ${{ inputs.defender && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the CLI
        run: cargo build --release -p genra-av --locked
      - name: Signed rule pack, hash lists and YARA rules
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cli=./target/release/genra-av; [ "$RUNNER_OS" = Windows ] && cli=$cli.exe
          flags=$(scripts/eval/get-pack.sh pack "$cli" ${{ inputs.yara_preview && 'preview' || '' }})
          echo "PACK_FLAGS=$flags" >> "$GITHUB_ENV"
          echo "CLI=$cli" >> "$GITHUB_ENV"
      - name: Defender on demand only, nothing sent to Microsoft
        if: inputs.defender
        shell: pwsh
        run: |
          # Samples are unpacked here: real-time protection would take them before Genra reads
          # them, and sample submission would upload them (cloud lookups stay on, as on a user's
          # machine). Defender is asked by Genra instead.
          Set-MpPreference -DisableRealtimeMonitoring $true -SubmitSamplesConsent 2
          # Today's signatures, as a user's machine has them.
          Update-MpSignature -ErrorAction Continue
          $m = Get-MpComputerStatus
          $m | Select-Object AntivirusEnabled, AMRunningMode, RealTimeProtectionEnabled, AntivirusSignatureVersion, AntivirusSignatureAge | Format-List
          # A run that asked nobody must not read as "Defender added nothing".
          if (-not $m.AntivirusEnabled -or $m.AMRunningMode -ne 'Normal') { Write-Error "Defender is not usable on this runner"; exit 1 }
      - name: Fetch samples
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          PER_TYPE: ${{ inputs.per_type || '20' }}
        run: |
          tmp=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          py=$(command -v python3 || command -v python)
          # shellcheck disable=SC2086
          "$py" scripts/eval/fetch_malware.py "$tmp/zips" "$PER_TYPE" $TYPES
      - name: Unpack, scan, delete
        run: |
          set -euo pipefail
          tmp=$(cygpath -m "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")
          s="$tmp/samples"
          for d in "$tmp"/zips/*/; do
            t=$(basename "$d")
            mkdir -p "$s/$t"
            for z in "$d"*.zip; do
              [ -e "$z" ] || continue
              sha=$(basename "$z" .zip)
              # One file per sample, named by its hash and its type's extension (the app decides by
              # extension which files go to Defender, so the measurement must too).
              7z e -y -pinfected -o"$s/$t/tmp" "$z" >/dev/null 2>&1 || { rm -rf "$s/$t/tmp"; continue; }
              f=$(find "$s/$t/tmp" -type f -print -quit)
              [ -n "$f" ] && mv "$f" "$s/$t/$sha.$t"
              rm -rf "$s/$t/tmp"
            done
          done
          # Files only: folders keep their execute bit so they can still be walked and deleted.
          find "$s" -type f -exec chmod a-x {} +
          # The scan's exit code says "something found"; an empty result is the failure to catch.
          # shellcheck disable=SC2086
          "$CLI" scan $PACK_FLAGS ${{ inputs.defender && '--defender' || '' }} --json "$s" > malware.jsonl || true
          cp "$tmp/zips/manifest.json" manifest.json
          rm -rf "$s" "$tmp/zips"
          echo "scanned: $(wc -l < malware.jsonl)"
          test -s malware.jsonl || { echo "no scan results: the pack or the scanner failed"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: malware-results
          path: |
            malware.jsonl
            manifest.json
          retention-days: 30

  clean:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build the CLI
        run: cargo build --release -p genra-av --locked
      - name: Signed rule pack, hash lists and YARA rules
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=$(scripts/eval/get-pack.sh pack ./target/release/genra-av.exe ${{ inputs.yara_preview && 'preview' || '' }})
          echo "PACK_FLAGS=$flags" >> "$GITHUB_ENV"
      - name: Clean corpus
        run: |
          mkdir -p clean/office
          # Office files without macros, made fresh so nothing in them is ours or borrowed.
          python -m pip install --quiet python-docx==1.1.2 openpyxl==3.1.5
          python scripts/eval/make_clean_office.py clean/office 200
          ./target/release/genra-av.exe scan $PACK_FLAGS --json clean/office > clean-office.jsonl || true
          ./target/release/genra-av.exe scan $PACK_FLAGS --json "C:/Windows/System32" > clean-system32.jsonl 2>/dev/null || true
          # Shortcuts and scripts Windows and installed programs ship: the false-positive check for
          # the shortcut and script heuristics.
          ./target/release/genra-av.exe scan $PACK_FLAGS --json \
            "C:/ProgramData/Microsoft/Windows/Start Menu" "C:/Users/Public/Desktop" \
            "C:/Windows/System32/WindowsPowerShell/v1.0/Modules" "C:/Program Files/WindowsPowerShell/Modules" \
            > clean-scripts.jsonl 2>/dev/null || true
          wc -l clean-*.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clean-results
          path: clean-*.jsonl
          retention-days: 30

  report:
    needs: [malware, clean]
    # A failed clean job must not hide the malware numbers (and the other way round is pointless).
    if: always() && needs.malware.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: results
          merge-multiple: true
      - name: Report
        run: |
          clean=()
          for f in results/clean-office.jsonl results/clean-system32.jsonl results/clean-scripts.jsonl; do [ -f "$f" ] && clean+=(--clean "$f"); done
          python3 scripts/eval/report.py --malware results/malware.jsonl --manifest results/manifest.json \
            "${clean[@]}" --json report.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detection-report
          path: report.json
          retention-days: 90
